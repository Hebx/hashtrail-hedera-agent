<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">HashTrail Tip Card NFT v1</title>
  <desc id="desc">Collectible Hedera testnet tip receipt card with HCS, HTS, HBAR, and HashScan proof motifs.</desc>
  <defs>
    <linearGradient id="titleFill" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f8fff9"/>
      <stop offset="0.45" stop-color="#d9fff2"/>
      <stop offset="1" stop-color="#ffe6a3"/>
    </linearGradient>
    <linearGradient id="band" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#061614" stop-opacity="0.72"/>
      <stop offset="0.55" stop-color="#101a1a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#020707" stop-opacity="0.76"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <image href="tip-card-art-v1.png" x="0" y="0" width="1254" height="1254" preserveAspectRatio="xMidYMid slice"/>

  <rect x="151" y="817" width="952" height="113" rx="5" fill="url(#band)" stroke="#d8bd72" stroke-width="2.5"/>
  <text x="627" y="866" text-anchor="middle" font-family="Inter, Avenir Next, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="5" fill="url(#titleFill)" filter="url(#softGlow)">HASHTRAIL TIP CARD</text>
  <text x="627" y="904" text-anchor="middle" font-family="Inter, Avenir Next, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="3" fill="#90ffe8">VERIFIABLE CONTRIBUTOR REWARD RECEIPT</text>

  <g font-family="Inter, Avenir Next, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#ecffd6" opacity="0.92">
    <text x="183" y="780">HCS RECEIPT</text>
    <text x="887" y="780">HBAR TIP</text>
    <text x="184" y="970">HTS NFT</text>
    <text x="882" y="970">HASHSCAN PROOF</text>
  </g>

  <g fill="none" stroke="#37f2d1" stroke-width="2" opacity="0.78">
    <path d="M265 786h-82v-35"/>
    <path d="M988 786h82v-35"/>
    <path d="M265 951h-82v35"/>
    <path d="M988 951h82v35"/>
  </g>
</svg>
